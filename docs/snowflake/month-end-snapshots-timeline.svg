<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="t d">
  <title id="t">Month-end snapshot timeline</title>
  <desc id="d">Four steps left to right: period close freezes March actuals into a snapshot; the report is sent from that run; a late posting lands only in current actuals; then a compare of snapshot versus current shows the 2,500 difference.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6B7B"/></marker>
  </defs>
  <style>
    .b{font:600 16px 'Space Grotesk',system-ui,sans-serif;fill:#E6EDF3}
    .s{font:400 15px Inter,system-ui,sans-serif;fill:#B7C5D3}
    .l{font:600 14px 'Space Grotesk',system-ui,sans-serif;fill:#9AA7B4}
    .m{font:500 15px 'JetBrains Mono',ui-monospace,monospace;fill:#E6EDF3}
    .n{font:700 14px 'Space Grotesk',system-ui,sans-serif;fill:#0F1720}
  </style>
  <rect width="840" height="320" fill="#0F1720"/>

  <!-- Connector line -->
  <line x1="118" y1="88" x2="722" y2="88" stroke="#2A3847" stroke-width="2"/>
  <g stroke="#5B6B7B" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M196 88H216"/>
    <path d="M392 88H412"/>
    <path d="M588 88H608"/>
  </g>

  <!-- 1 Period close -->
  <circle cx="118" cy="88" r="18" fill="#38BDF8"/><text x="118" y="93" text-anchor="middle" class="n">1</text>
  <rect x="28" y="128" width="180" height="140" rx="10" fill="#18222E" stroke="#38BDF8" stroke-width="2"/>
  <text x="118" y="158" text-anchor="middle" class="b">Period close</text>
  <text x="118" y="186" text-anchor="middle" class="s">Freeze March</text>
  <text x="118" y="210" text-anchor="middle" class="m">2026-03</text>
  <text x="118" y="238" text-anchor="middle" class="s">into snapshot</text>
  <text x="118" y="258" text-anchor="middle" class="m">R1</text>

  <!-- 2 Report sent -->
  <circle cx="314" cy="88" r="18" fill="#38BDF8"/><text x="314" y="93" text-anchor="middle" class="n">2</text>
  <rect x="224" y="128" width="180" height="140" rx="10" fill="#18222E" stroke="#38BDF8" stroke-width="2"/>
  <text x="314" y="158" text-anchor="middle" class="b">Report sent</text>
  <text x="314" y="186" text-anchor="middle" class="s">Pack from snapshot</text>
  <text x="314" y="214" text-anchor="middle" class="m">58 rows</text>
  <text x="314" y="242" text-anchor="middle" class="m">1,466,143.86</text>

  <!-- 3 Late posting -->
  <circle cx="510" cy="88" r="18" fill="#F87171"/><text x="510" y="93" text-anchor="middle" class="n">3</text>
  <rect x="420" y="128" width="180" height="140" rx="10" fill="#18222E" stroke="#F87171" stroke-width="2"/>
  <text x="510" y="158" text-anchor="middle" class="b" style="fill:#F87171">Late posting</text>
  <text x="510" y="186" text-anchor="middle" class="s">Into current only</text>
  <text x="510" y="214" text-anchor="middle" class="m">CC2000 / 500000</text>
  <text x="510" y="242" text-anchor="middle" class="m">+2,500.00</text>

  <!-- 4 Snapshot vs current -->
  <circle cx="706" cy="88" r="18" fill="#A3E635"/><text x="706" y="93" text-anchor="middle" class="n">4</text>
  <rect x="616" y="128" width="196" height="140" rx="10" fill="#18222E" stroke="#A3E635" stroke-width="2"/>
  <text x="714" y="158" text-anchor="middle" class="b" style="fill:#A3E635">Snapshot vs current</text>
  <text x="714" y="186" text-anchor="middle" class="s">Reported stays put</text>
  <text x="714" y="214" text-anchor="middle" class="m">59 / 1,468,643.86</text>
  <text x="714" y="242" text-anchor="middle" class="m">diff 2,500.00</text>

  <text x="28" y="300" class="l">Time Travel is for recovery this week. The snapshot answers “what number did we report?”</text>
</svg>
