<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>{{SUBJECT}}</title></head>

{{TABLE_ROWS}}

</table></td></tr>
<tr><td style="padding:8px 24px 24px;font-size:13px;line-height:20px;color:#52606D;">{{NOTE}}</td></tr>
<tr><td style="padding:16px 24px;border-top:1px solid #DDE3EA;font-size:12px;line-height:18px;color:#7B8794;">{{FOOTER}}</td></tr>
</table></td></tr></table></body></html>
