<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="t d">
  <title id="t">FX rate lookup flow</title>
  <desc id="d">Three steps left to right: try an exact month-end rate on FX_RATE_PERIOD; if the calendar day has no rate, ASOF JOIN takes the latest prior daily rate; if no rate exists at all, V_FX_MISSING_RATES raises a gap alert before the pack goes out.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6B7B"/></marker>
  </defs>
  <style>
    .b{font:600 16px 'Space Grotesk',system-ui,sans-serif;fill:#E6EDF3}
    .s{font:400 15px Inter,system-ui,sans-serif;fill:#B7C5D3}
    .l{font:600 14px 'Space Grotesk',system-ui,sans-serif;fill:#9AA7B4}
    .m{font:500 15px 'JetBrains Mono',ui-monospace,monospace;fill:#E6EDF3}
    .n{font:700 14px 'Space Grotesk',system-ui,sans-serif;fill:#0F1720}
  </style>
  <rect width="840" height="320" fill="#0F1720"/>

  <line x1="118" y1="88" x2="722" y2="88" stroke="#2A3847" stroke-width="2"/>
  <g stroke="#5B6B7B" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M196 88H248"/>
    <path d="M432 88H484"/>
  </g>

  <!-- 1 Exact -->
  <circle cx="118" cy="88" r="18" fill="#38BDF8"/><text x="118" y="93" text-anchor="middle" class="n">1</text>
  <rect x="28" y="128" width="188" height="140" rx="10" fill="#18222E" stroke="#38BDF8" stroke-width="2"/>
  <text x="122" y="158" text-anchor="middle" class="b">Exact match</text>
  <text x="122" y="186" text-anchor="middle" class="s">Month-end rate</text>
  <text x="122" y="214" text-anchor="middle" class="m">FX_RATE_PERIOD</text>
  <text x="122" y="242" text-anchor="middle" class="s">Same rate for the pack</text>

  <!-- 2 ASOF -->
  <circle cx="340" cy="88" r="18" fill="#8B7CF6"/><text x="340" y="93" text-anchor="middle" class="n">2</text>
  <rect x="250" y="128" width="188" height="140" rx="10" fill="#18222E" stroke="#8B7CF6" stroke-width="2"/>
  <text x="344" y="158" text-anchor="middle" class="b" style="fill:#A78BFA">ASOF fallback</text>
  <text x="344" y="186" text-anchor="middle" class="s">No rate that day?</text>
  <text x="344" y="214" text-anchor="middle" class="m">FX_RATE_DAILY</text>
  <text x="344" y="242" text-anchor="middle" class="s">Latest prior rate</text>

  <!-- 3 Missing -->
  <circle cx="562" cy="88" r="18" fill="#F87171"/><text x="562" y="93" text-anchor="middle" class="n">3</text>
  <rect x="472" y="128" width="188" height="140" rx="10" fill="#18222E" stroke="#F87171" stroke-width="2"/>
  <text x="566" y="158" text-anchor="middle" class="b" style="fill:#F87171">Missing alert</text>
  <text x="566" y="186" text-anchor="middle" class="s">No rate at all</text>
  <text x="566" y="210" text-anchor="middle" class="m" style="font-size:13px">V_FX_MISSING_RATES</text>
  <text x="566" y="242" text-anchor="middle" class="s">Stop before the pack</text>

  <!-- Sample gap callout -->
  <rect x="680" y="128" width="140" height="140" rx="10" fill="#18222E" stroke="#A3E635" stroke-width="2"/>
  <text x="750" y="168" text-anchor="middle" class="b" style="fill:#A3E635">Seeded gap</text>
  <text x="750" y="200" text-anchor="middle" class="m">2026-05</text>
  <text x="750" y="228" text-anchor="middle" class="s">exactly</text>
  <text x="750" y="252" text-anchor="middle" class="m">1 row</text>

  <text x="28" y="300" class="l">Closed packs use the locked period rate. ASOF is for calendar gaps — not for the number you send.</text>
</svg>
