site_name: Finance Data Hub
site_description: Practical notes on Snowflake, Jedox, and Excel VBA for finance and FP&A.
site_url: https://balazs998.github.io/finance-data-hub/
copyright: Balazs · Finance Data Hub

# The only analytics setting. Site code for https://financedatahub.goatcounter.com
# Clear the value to turn analytics off. The site still builds.
extra:
  goatcounter_code: financedatahub

extra_css:
  - stylesheets/extra.css
  - stylesheets/docs-note.css
  - stylesheets/email-tool.css
  - stylesheets/rule-studio.css
  - stylesheets/section.css

extra_javascript:
  - javascripts/reveal.js
  - javascripts/diagram-fade.js
  - javascripts/email-sources.js
  - javascripts/email-shared.js
  - javascripts/email-check-messages.js
  - javascripts/email-generate.js
  - javascripts/email-checker-core.js
  - javascripts/email-completions.js
  - javascripts/email-live-lint.js
  - javascripts/codemirror-bundle.js
  - javascripts/email-builder-ui.js
  - javascripts/email-checker-ui.js
  - javascripts/rule-checks.js
  - javascripts/rule-diff.js
  - javascripts/rule-mock.js
  - javascripts/rule-studio-config.js
  - javascripts/rule-studio-ui.js

theme:
  name: material
  custom_dir: overrides
  favicon: images/favicon.svg
  logo: images/logo.svg
  font: false
  palette:
    scheme: slate
    primary: black
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.tabs.link
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

hooks:
  - hooks/site.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Snowflake:
      - snowflake/index.md
      - Month-end actuals: snowflake/month-end-actuals.md
      - Plan vs actuals: snowflake/plan-vs-actuals.md
      - Snapshots vs Time Travel: snowflake/month-end-snapshots.md
      - FX rate lock: snowflake/fx-rate-lock.md
      - ASOF JOIN: snowflake/asof-join.md
      - 13-week cash runway: snowflake/automaker-13-week-cash-runway.md
      - Cost per vehicle: snowflake/automaker-cost-per-vehicle.md
      - Capex project tracking: snowflake/automaker-capex-project-tracking.md
      - BOM cost rollup: snowflake/automaker-bom-cost-rollup.md
  - Jedox:
      - jedox/index.md
      - Management report export: jedox/management-report-export.md
      - Snowflake to Jedox load: jedox/snowflake-to-jedox.md
      - Relational extracts: jedox/relational-extracts.md
      - Failure-only alerts: jedox/failure-alerts.md
      - Automated value emails: jedox/automated-value-emails.md
      - Create your own email:
          - Builder: jedox/email-builder.md
          - Check your email script: jedox/email-checker.md
      - Business Rule Studio: jedox/rule-studio/index.md
      - Rule Studio worker setup: WORKER-SETUP.md
  - VBA:
      - vba/index.md
      - Email macros after New Outlook: vba/new-outlook-email.md
      - VBScript deprecation: vba/vbscript-deprecation.md
      - Month-close checks: vba/month-close-checks.md
      - Excel as a thin front end: vba/excel-thin-front-end.md
  - Downloads: downloads.md
  - About: about.md
