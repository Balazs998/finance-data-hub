<title id="t">FDH Motors M-B bill of materials: vehicle, 4 assemblies, 14 part lines, standard cost 2026-03</title>
<desc id="d">Model M-B (level 0) is built from four assemblies (level 1): A-BODY-B, A-PT-B, A-INT-B and the shared A-ELEC. Each has parts (level 2), 14 part lines in total; two per assembly are shown with quantity and 2026-03 standard cost, the rest as a count. Rolled-up standard cost for M-B is 11,707.40 in 2026-03. From 2026-04-01 A-PT-B swaps P-CELL-01 x110 at 48.00 for P-CELL-02 x96 at 51.00, so M-B drops to 11,323.40 in 2026-04. Fictional sample data.</desc>
