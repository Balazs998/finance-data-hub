<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="t d">
<title id="t">FDH Motors control totals at every hop: ERP file, Snowflake lines, Snowflake cells, Jedox</title>
<desc id="d">The 2026-03 ERP file trailer says 284 lines and 1,466,143.86. The lines land in ERP_GL_LANDING and V_ERP_GL_LANDED (284 lines, 1,466,143.86), aggregate in V_ERP_GL_CELLS to 58 cells (1,466,143.86), and the Jedox job reports 58 cells. Check 1 compares rows and total, check 2 compares the total, check 3 compares cells and total; all pass on the clean run. Each hop writes a row to LOAD_LOG; V_CONTROL_RECON compares the hops and appends one row per run to CONTROL_EVIDENCE: R1 PASS, R2 FAIL (one dropped line, -6,035.36), R3 DUPLICATE. Fictional sample data; the Jedox hop is not run on a live system.</desc>
