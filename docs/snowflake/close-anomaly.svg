<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="t d">
<title id="t">FDH Motors close tracker and journal anomaly flags</title>
<desc id="d">Left: the 2026-03 close of 25 tasks by workday: WD1 16%, WD2 36%, WD3 48%, WD4 72%, WD5 76%, WD6 88%, WD7 96% done. CT10, CT12 and CT21 finished late and CT19 is blocked. Right: 1,602 journal lines in ERP_GL_EXTRACT go through three checks: V_JE_ZSCORE flags 3, V_JE_IQR flags 33, V_JE_RULES flags 3. That is 39 flags on 35 distinct lines in V_JE_FLAGS, because every z-score line is also an IQR line and S4 also breaks a rule. The gate returns 1 and V_JE_ALERT sends the review list. Simple statistics and rules, not AI; fictional sample data.</desc>
