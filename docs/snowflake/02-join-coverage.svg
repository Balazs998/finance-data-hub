<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">What each join keeps</title>
<desc id="d">Plan versus actuals cells kept by each join on the sample data. INNER JOIN keeps 605 cells that have both budget and actual. LEFT JOIN from budget keeps 696: the 605 matched plus 91 budget-only. FULL OUTER JOIN keeps all 701: 605 matched, 91 budget-only and 5 actual-only.</desc>
<style>.h{font:700 24px 'Space Grotesk',system-ui,sans-serif;fill:#E6EDF3}.l{font:500 17px Inter,system-ui,sans-serif;fill:#E6EDF3}.m{font:400 15px Inter,system-ui,sans-serif;fill:#B7C5D3}.n{font:600 17px 'JetBrains Mono',ui-monospace,monospace;fill:#E6EDF3}</style>
<rect width="720" height="400" fill="#0F1720"/>
<text x="28" y="48" class="h">What each join keeps</text>
<text x="28" y="76" class="m">Plan vs. actuals cells in the sample data</text>
<text x="28" y="137" class="l">INNER JOIN</text>
<rect x="210.0" y="110" width="371.1" height="40" rx="4" fill="#38BDF8"/>
<text x="593.1" y="137" class="n">605</text>
<text x="28" y="203" class="l">LEFT JOIN (budget)</text>
<rect x="210.0" y="176" width="371.1" height="40" rx="4" fill="#38BDF8"/>
<rect x="583.1" y="176" width="55.8" height="40" rx="4" fill="#8B7CF6"/>
<text x="650.9" y="203" class="n">696</text>
<text x="28" y="269" class="l">FULL OUTER JOIN</text>
<rect x="210.0" y="242" width="371.1" height="40" rx="4" fill="#38BDF8"/>
<rect x="583.1" y="242" width="55.8" height="40" rx="4" fill="#8B7CF6"/>
<rect x="640.9" y="242" width="4.0" height="40" rx="4" fill="#A3E635"/>
<text x="656.9" y="269" class="n">701</text>
<line x1="210" y1="100" x2="210" y2="292" stroke="#2A3847"/>
<rect x="28" y="324" width="16" height="16" rx="3" fill="#38BDF8"/><text x="54" y="338" class="m">In both (605)</text>
<rect x="218" y="324" width="16" height="16" rx="3" fill="#8B7CF6"/><text x="244" y="338" class="m">Budget only (91)</text>
<rect x="408" y="324" width="16" height="16" rx="3" fill="#A3E635"/><text x="434" y="338" class="m">Actual only (5)</text>
<text x="28" y="374" class="m">Only the full join keeps every cell.</text></svg>