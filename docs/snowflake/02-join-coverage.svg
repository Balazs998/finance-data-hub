<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">What each join keeps</title>
<desc id="d">Plan versus actuals cells kept by each join on the sample data. INNER JOIN keeps 605 cells that have both budget and actual. LEFT JOIN from budget keeps 696: the 605 matched plus 91 budget-only. FULL OUTER JOIN keeps all 701: 605 matched, 91 budget-only and 5 actual-only.</desc>
<style>.h{font:700 22px 'Space Grotesk',system-ui,sans-serif;fill:#E6EDF3}.l{font:500 16px Inter,system-ui,sans-serif;fill:#E6EDF3}.m{font:400 14px Inter,system-ui,sans-serif;fill:#9AA7B4}.n{font:600 15px 'JetBrains Mono',ui-monospace,monospace;fill:#E6EDF3}</style>
<rect width="1200" height="420" fill="#0F1720"/>
<text x="40" y="52" class="h">What each join keeps</text>
<text x="40" y="80" class="m">Plan vs. actuals cells in the sample data</text>
<text x="40" y="147" class="l">INNER JOIN</text>
<rect x="300.0" y="120" width="673.2" height="40" rx="4" fill="#38BDF8"/>
<text x="987.2" y="146" class="n">605</text>
<text x="40" y="217" class="l">LEFT JOIN from budget</text>
<rect x="300.0" y="190" width="673.2" height="40" rx="4" fill="#38BDF8"/>
<rect x="975.2" y="190" width="101.3" height="40" rx="4" fill="#8B7CF6"/>
<text x="1090.4" y="216" class="n">696</text>
<text x="40" y="287" class="l">FULL OUTER JOIN</text>
<rect x="300.0" y="260" width="673.2" height="40" rx="4" fill="#38BDF8"/>
<rect x="975.2" y="260" width="101.3" height="40" rx="4" fill="#8B7CF6"/>
<rect x="1078.4" y="260" width="5.6" height="40" rx="4" fill="#A3E635"/>
<text x="1098.0" y="286" class="n">701</text>
<line x1="300" y1="110" x2="300" y2="310" stroke="#2A3847"/>
<rect x="40" y="367" width="16" height="16" rx="3" fill="#38BDF8"/><text x="66" y="380" class="m">In both (605)</text>
<rect x="240" y="367" width="16" height="16" rx="3" fill="#8B7CF6"/><text x="266" y="380" class="m">Budget only (91)</text>
<rect x="440" y="367" width="16" height="16" rx="3" fill="#A3E635"/><text x="466" y="380" class="m">Actual only (5)</text>
<text x="1160" y="380" class="m" text-anchor="end">Only the full join keeps every cell.</text></svg>